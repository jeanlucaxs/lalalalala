<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    
    <title>404 - Página Não Encontrada | JeaxLabs</title>
    
    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    
    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      body {
        background-color: #0A0A0A;
        color: #EDEDED;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }

      .card {
        max-width: 440px;
        width: 100%;
        text-align: center;
        background: #121212;
        border: 1px solid #262626;
        border-radius: 16px;
        padding: 40px 28px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      }

      .badge {
        display: inline-block;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid #262626;
        color: #A1A1AA;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.75rem;
        padding: 4px 12px;
        border-radius: 20px;
        margin-bottom: 24px;
        letter-spacing: 0.5px;
      }

      .code {
        font-size: 4.5rem;
        font-weight: 800;
        color: #FFFFFF;
        line-height: 1;
        margin-bottom: 16px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        letter-spacing: -2px;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        color: #F4F4F5;
        margin-bottom: 8px;
      }

      p {
        font-size: 0.9rem;
        color: #A1A1AA;
        line-height: 1.5;
        margin-bottom: 28px;
      }

      .btn {
        display: inline-block;
        width: 100%;
        background: #FFFFFF;
        color: #0A0A0A;
        text-decoration: none;
        padding: 12px 20px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.9rem;
        transition: opacity 0.2s ease, transform 0.1s ease;
      }

      .btn:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">ERR // 404 NOT FOUND</div>
      <div class="code">404</div>
      <h1>Recurso não encontrado</h1>
      <p>O recurso ou módulo que você tentou acessar não está disponível no servidor da <strong>JeaxLabs</strong>.</p>
      <a href="/" class="btn">Voltar para o início</a>
    </div>
  </body>
</html>
